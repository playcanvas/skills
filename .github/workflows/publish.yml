name: Publish

on:
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        if: ${{ github.repository_owner == 'playcanvas' }}
        permissions:
            contents: write
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  generate_release_notes: true
                  prerelease: false
