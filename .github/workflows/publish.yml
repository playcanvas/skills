name: Publish

on:
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
    publish:
        name: Publish
        runs-on: ubuntu-latest
        if: ${{ github.repository_owner == 'playcanvas' }}
        permissions:
            contents: write
        steps:
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  generate_release_notes: true
                  prerelease: ${{ startsWith(github.ref_name, 'v0.') }}

            - name: Generate app token
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  app-id: ${{ secrets.APP_ID }}
                  private-key: ${{ secrets.APP_KEY }}
                  owner: playcanvas
                  repositories: create-playcanvas

            - name: Sync create-playcanvas skills
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: gh api --method POST repos/playcanvas/create-playcanvas/dispatches -f event_type=skills-release
