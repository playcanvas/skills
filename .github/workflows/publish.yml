name: Publish

on:
    workflow_dispatch:
        inputs:
            type:
                description: Version increment
                type: choice
                options:
                    - patch
                    - minor
                    - major

concurrency: publish

jobs:
    publish:
        name: Publish
        runs-on: ubuntu-latest
        if: ${{ github.repository_owner == 'playcanvas' && github.ref == 'refs/heads/main' }}
        permissions:
            contents: write
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  package-manager-cache: false

            - name: Bump version
              id: version
              env:
                  TYPE: ${{ inputs.type }}
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898208+github-actions[bot]@users.noreply.github.com'
                  npm version "$TYPE" --no-git-tag-version
                  node scripts/sync-plugin-version.mjs
                  TAG="v$(node -p 'require("./package.json").version')"
                  git commit -am "$TAG"
                  git tag -a "$TAG" -m "$TAG"
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"

            - name: Push release commit and tag
              env:
                  TAG: ${{ steps.version.outputs.tag }}
              run: git push --atomic origin HEAD:main "$TAG"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ steps.version.outputs.tag }}
                  generate_release_notes: true
                  prerelease: ${{ startsWith(steps.version.outputs.tag, 'v0.') }}
