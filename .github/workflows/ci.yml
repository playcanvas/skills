name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Run tests
        run: node --test test/*.test.mjs

  skills:
    name: Validate skills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install the Agent Skills validator
        run: python -m pip install --disable-pip-version-check skills-ref==0.1.1

      - name: Validate canonical skills
        run: |
          for skill in plugins/engine/skills/*; do
            agentskills validate "$skill"
          done

  packages:
    name: Audit package contracts
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Audit current npm packages
        run: node scripts/audit-packages.mjs

      - name: Compile supported surfaces
        run: node scripts/smoke-surfaces.mjs

      - name: Verify compressed GLB normalization
        run: node scripts/smoke-gltf-transform.mjs
